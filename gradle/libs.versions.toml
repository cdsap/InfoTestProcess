[versions]
kotlin = "2.4.10"
develocity = "4.5.0"
serialization = "1.11.0"
junit = "4.13.2"

[libraries]
develocity-gradlePlugin = { module = "com.gradle:develocity-gradle-plugin", version.ref = "develocity" }
kotlinx-serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
pluginPublish = { id = "com.gradle.plugin-publish", version = "2.1.1" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
