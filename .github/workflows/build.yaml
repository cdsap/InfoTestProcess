name: Run Gradle on PRs
on:
    pull_request:
    push:
        branches: main
jobs:
    prBranch:
        timeout-minutes: 300
        strategy:
            matrix:
                os: [ubuntu-latest,macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 17
            - name: Build Process Watcher
              uses: cdsap/build-process-watcher@v0.6.2
              with:
                remote_monitoring: 'true'
                export_to_bigquery: 'true'
            - name: Execute Gradle build
              run:  ./gradlew test
              env:
                  GE_URL: ${{ secrets.GE_URL }}
                  GE_API_KEY: ${{ secrets.GE_API_KEY }}

    e2e-cc:
        needs: prBranch
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 17
            - name: Build Process Watcher
              uses: cdsap/build-process-watcher@v0.6.2
              with:
                remote_monitoring: 'true'
                export_to_bigquery: 'true'
            - name: Publish plugin to mavenLocal
              run: ./gradlew publishToMavenLocal
            - name: First build — expect "Configuration cache entry stored"
              working-directory: e2e/consumer
              shell: bash
              run: |
                  set -euo pipefail
                  log="${RUNNER_TEMP:-/tmp}/cc-first.log"
                  ../../gradlew test --configuration-cache 2>&1 | tee "$log"
                  grep -q "Configuration cache entry stored" "$log" \
                      || { echo "::error::First build did not store CC"; exit 1; }
            - name: Second build — expect "Configuration cache entry reused"
              working-directory: e2e/consumer
              shell: bash
              run: |
                  set -euo pipefail
                  log="${RUNNER_TEMP:-/tmp}/cc-second.log"
                  ../../gradlew test --configuration-cache 2>&1 | tee "$log"
                  grep -q "Configuration cache entry reused" "$log" \
                      || { echo "::error::Second build did not reuse CC"; exit 1; }
            - name: Verify plugin produced agent + stats artifacts
              working-directory: e2e/consumer
              shell: bash
              run: |
                  set -euo pipefail
                  scratch=build/info-test-process
                  test -f "$scratch/agent.jar" \
                      || { echo "::error::agent jar not extracted"; exit 1; }
                  stats_files=$(ls $scratch/workers/*.stats.json 2>/dev/null | wc -l | tr -d ' ')
                  [ "$stats_files" -ge 1 ] \
                      || { echo "::error::no worker stats files produced"; exit 1; }
                  identity_files=$(ls $scratch/workers/*.json 2>/dev/null | grep -v '\.stats\.json' | wc -l | tr -d ' ')
                  [ "$identity_files" -eq "$stats_files" ] \
                      || { echo "::error::identity ($identity_files) != stats ($stats_files) — orphans detected"; exit 1; }
                  test -f "$scratch/statsTestTasks.json" \
                      || { echo "::error::statsTestTasks.json not generated"; exit 1; }
                  for key in summary byTask workers tags; do
                      grep -q "\"$key\"" "$scratch/statsTestTasks.json" \
                          || { echo "::error::statsTestTasks.json missing \"$key\""; exit 1; }
                  done
                  echo "OK — agent loaded $stats_files worker(s), identity/stats files balanced, output JSON contains summary/byTask/workers/tags"

    e2e-isolated-projects:
        needs: prBranch
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 17
            - name: Build Process Watcher
              uses: cdsap/build-process-watcher@v0.6.2
              with:
                remote_monitoring: 'true'
                export_to_bigquery: 'true'
            - name: Publish plugin to mavenLocal
              run: ./gradlew publishToMavenLocal
            - name: First build with Isolated Projects — store
              working-directory: e2e/consumer
              shell: bash
              run: |
                  set -euo pipefail
                  log="${RUNNER_TEMP:-/tmp}/ip-first.log"
                  ../../gradlew test -Dorg.gradle.unsafe.isolated-projects=true 2>&1 | tee "$log"
                  grep -q "Configuration cache entry stored" "$log" \
                      || { echo "::error::IP first build did not store CC"; exit 1; }
            - name: Second build with Isolated Projects — reuse
              working-directory: e2e/consumer
              shell: bash
              run: |
                  set -euo pipefail
                  log="${RUNNER_TEMP:-/tmp}/ip-second.log"
                  ../../gradlew test -Dorg.gradle.unsafe.isolated-projects=true 2>&1 | tee "$log"
                  grep -q "Configuration cache entry reused" "$log" \
                      || { echo "::error::IP second build did not reuse CC"; exit 1; }

    compatibility:
        needs: prBranch
        name: "${{ matrix.project }} / Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}"
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                include:
                    # Minimum supported Gradle
                    - project: e2e/consumer
                      gradle: "8.0.2"
                      java: "17"

                    # Latest Gradle 8.x
                    - project: e2e/consumer
                      gradle: "8.14.3"
                      java: "17"

                    - project: e2e/consumer
                      gradle: "8.14.3"
                      java: "21"

                    # Current Gradle
                    - project: e2e/consumer
                      gradle: "9.7.1"
                      java: "17"

                    - project: e2e/consumer
                      gradle: "9.7.1"
                      java: "21"

                    - project: e2e/consumer
                      gradle: "9.7.1"
                      java: "25"

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            # Build/publish the plugin itself with its required JDK 17 toolchain
            - name: Setup JDK 17 for plugin build
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 17

            - name: Publish plugin to mavenLocal
              run: ./gradlew publishToMavenLocal

            # Now switch to the JDK we actually want to test
            - name: Setup JDK ${{ matrix.java }}
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: ${{ matrix.java }}

            - name: Setup Gradle ${{ matrix.gradle }}
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: ${{ matrix.gradle }}

            - name: Test consumer
              working-directory: ${{ matrix.project }}
              run: gradle test --configuration-cache

            - name: Verify InfoTestProcess output
              working-directory: ${{ matrix.project }}
              shell: bash
              run: |
                  set -euo pipefail

                  test -f build/info-test-process/statsTestTasks.json \
                      || {
                          echo "::error::statsTestTasks.json was not generated"
                          exit 1
                      }

                  echo "OK — Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}"
