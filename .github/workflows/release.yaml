name: Publish Gradle plugin

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    publish:
        name: Publish release to Gradle Plugin Portal
        runs-on: ubuntu-latest
        steps:
            - name: Check out the published release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}

            - uses: gradle/actions/wrapper-validation@v6

            - name: Setup JDK 17
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 17
                  cache: gradle

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Validate release policy
              shell: bash
              env:
                  RELEASE_DRAFT: ${{ github.event.release.draft }}
                  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  set -euo pipefail

                  if [[ "$RELEASE_DRAFT" == "true" ]]; then
                      echo "::error::Draft releases cannot publish to the Gradle Plugin Portal"
                      exit 1
                  fi

                  if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
                      echo "::error::Prereleases cannot publish to the Gradle Plugin Portal"
                      exit 1
                  fi

            - name: Check publication credentials
              shell: bash
              env:
                  GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
                  GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
              run: |
                  set -euo pipefail

                  if [[ -z "$GRADLE_PUBLISH_KEY" ]]; then
                      echo "::error::GRADLE_PUBLISH_KEY is not configured"
                      exit 1
                  fi
                  if [[ -z "$GRADLE_PUBLISH_SECRET" ]]; then
                      echo "::error::GRADLE_PUBLISH_SECRET is not configured"
                      exit 1
                  fi

            - name: Reject SNAPSHOT plugin versions
              shell: bash
              run: |
                  set -euo pipefail

                  version="$(./gradlew -q :plugin:properties | awk -F': ' '$1 == "version" {print $2; exit}')"
                  if [[ -z "$version" ]]; then
                      echo "::error::Unable to determine the plugin version"
                      exit 1
                  fi
                  case "$version" in
                      *SNAPSHOT*|*snapshot*)
                          echo "::error::Refusing to publish SNAPSHOT plugin version $version"
                          exit 1
                          ;;
                  esac
                  echo "Publishing plugin version $version"

            - name: Validate plugin publication
              run: ./gradlew publishPlugins --validate-only
              env:
                  GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
                  GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

            - name: Publish plugin
              run: ./gradlew publishPlugins
              env:
                  GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
                  GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
